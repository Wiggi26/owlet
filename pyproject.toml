[project]
name = "owlet-development"
version = "0.0.0"
requires-python = ">=3.13.2,!=3.14.0,!=3.14.1,<3.15"

[dependency-groups]
test = [
  "homeassistant==2025.12.4; python_version < '3.14'",
  "homeassistant==2026.10.2; python_full_version >= '3.14.2'",
  "pytest-homeassistant-custom-component==0.13.301; python_version < '3.14'",
  "pytest-homeassistant-custom-component==0.13.373; python_full_version >= '3.14.2'",
  "pytest==9.0.0; python_version < '3.14'",
  "pytest==9.0.3; python_full_version >= '3.14.2'",
  "pytest-asyncio==1.3.0; python_version < '3.14'",
  "pytest-asyncio==1.4.0; python_full_version >= '3.14.2'",
  "pyowletapi==2025.4.1",
]
quality = ["ruff==0.17.1", "pip-audit==2.10.1", "zizmor==1.31.1"]

[tool.uv]
package = false
default-groups = ["test", "quality"]
environments = ["sys_platform == 'linux'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-config --strict-markers --disable-socket --allow-unix-socket --timeout=30 --cov=custom_components.owlet --cov-branch --cov-report=term-missing --cov-fail-under=90"
xfail_strict = true

[tool.coverage.run]
source = ["custom_components/owlet"]
branch = true

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.owlet", "tests"]

